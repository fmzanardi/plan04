<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plan 04">
<meta name="theme-color" content="#f5f2ed">
<title>Plan 04</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #f5f2ed;
  --surface: #ffffff;
  --surface2: #f0ede8;
  --border: #e0ddd8;
  --border2: #eae7e2;
  --text: #0f0e0c;
  --muted: #888;
  --muted2: #666;
  --push: #C8390A;
  --pull: #1A4FA8;
  --lower: #1A7A48;
  --bjj: #B8860B;
  --pump: #7B2FBE;
  --abs: #b03060;
  --rest: #999;
  --run: #0a7a8a;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}

html, body { height: 100%; background: var(--bg); }

body {
  color: var(--text);
  font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  max-width: 480px;
  margin: 0 auto;
  overscroll-behavior: none;
  -webkit-font-smoothing: antialiased;
}

button { font-family: inherit; }

/* TOPBAR */
#topbar {
  position: fixed; top: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px;
  background: rgba(245,242,237,0.96);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--border);
  z-index: 100;
  padding-top: var(--safe-top);
}

#topbar-inner { padding: 14px 18px 0; }

.topbar-row1 { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 13px; }

.day-title-label { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.day-title-main { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; line-height: 1; }

/* Progress ring */
.ring-wrap { position: relative; width: 48px; height: 48px; flex-shrink: 0; }
.ring-wrap svg { position: absolute; top:0; left:0; transform: rotate(-90deg); }
.ring-inner { position: absolute; inset: 5px; border-radius: 50%; background: var(--surface); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }

/* Day strip */
#day-strip {
  display: flex; gap: 7px; overflow-x: auto; padding: 0 18px 14px;
  scrollbar-width: none;
}
#day-strip::-webkit-scrollbar { display: none; }

.day-btn {
  flex: 0 0 auto; padding: 7px 13px;
  border-radius: 9px; border: 1.5px solid var(--border);
  background: transparent; color: var(--muted);
  font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
  cursor: pointer; position: relative; transition: all 0.15s;
}
.day-btn.active { border-color: var(--day-color, #888); background: color-mix(in srgb, var(--day-color, #888) 12%, transparent); color: var(--day-color, #888); }
.day-btn .today-dot { position: absolute; top: 2px; right: 3px; width: 4px; height: 4px; border-radius: 50%; background: var(--day-color, #888); }

/* Nav tabs */
#nav { padding: 0 18px 13px; }
.nav-bg { display: flex; background: #e8e5e0; border-radius: 9px; padding: 2px; width: 100%; }
.nav-tab {
  flex: 1; padding: 8px 0; border-radius: 7px; border: none;
  background: transparent; color: var(--muted);
  font-size: 12px; font-weight: 600; letter-spacing: 0.06em;
  cursor: pointer; text-transform: uppercase; transition: all 0.15s;
}
.nav-tab.active { background: var(--surface2); color: var(--text); }

/* SCROLL AREA */
#scroll {
  padding-top: 180px;
  padding-bottom: calc(32px + var(--safe-bot));
  min-height: 100vh;
}

/* === SESSION VIEW === */
.session-wrap { padding: 16px 16px 0; }

.run-banner {
  padding: 11px 15px; margin-bottom: 14px;
  background: #e8f5f7; border: 1px dashed #0a7a8a;
  border-radius: 9px; font-size: 13px; color: #4ab8c8;
  display: flex; align-items: center; gap: 9px;
}

.section-head {
  font-size: 10px; font-weight: 700; letter-spacing: 0.2em;
  text-transform: uppercase; padding: 18px 0 8px;
  border-bottom: 1px solid var(--border2);
}
.section-head.abs-head { color: var(--abs); border-color: #fce8f0; }
.section-head.norm-head { color: var(--muted); }

.ex-row {
  padding: 16px 0;
  border-bottom: 1px solid var(--border2);
}

.ex-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }

.ex-info { flex: 1; padding-right: 12px; }
.ex-name { font-size: 16px; font-weight: 600; line-height: 1.3; }
.ex-sets-label { font-size: 13px; color: var(--muted); margin-top: 4px; }
.ex-note { font-size: 12px; color: #999; margin-top: 3px; font-style: italic; }
.ex-prog { font-size: 11px; margin-top: 4px; font-weight: 500; }

.weight-btn {
  padding: 9px 12px; background: var(--surface2);
  border: 1px solid var(--border); border-radius: 9px;
  color: var(--text); font-size: 15px; font-weight: 700;
  cursor: pointer; text-align: center; min-width: 64px;
  line-height: 1.2;
}
.weight-unit { font-size: 10px; color: var(--muted); font-weight: 400; display: block; }

.weight-input-wrap { display: flex; gap: 5px; align-items: center; }
.weight-input {
  width: 66px; padding: 9px 7px; background: var(--surface2);
  border-radius: 7px; color: var(--text); font-size: 15px;
  text-align: center; border: 1.5px solid var(--day-color, #888);
  outline: none;
}

.sets-row { display: flex; gap: 8px; flex-wrap: wrap; }
.set-btn {
  width: 48px; height: 48px; border-radius: 10px;
  border: 2px solid var(--border); background: var(--surface);
  color: var(--muted); font-size: 13px; font-weight: 700;
  cursor: pointer; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 1px;
  transition: all 0.12s; -webkit-user-select: none;
}
.set-btn.done { border-color: var(--day-color, #888); background: color-mix(in srgb, var(--day-color, #888) 15%, transparent); color: var(--day-color, #888); }
.set-btn.done.abs-set { border-color: var(--abs); background: color-mix(in srgb, var(--abs) 15%, transparent); color: var(--abs); }
.set-num { font-size: 15px; line-height: 1; }
.set-lbl { font-size: 8px; color: #999; font-weight: 400; }

.finish-row { padding: 24px 0 8px; display: flex; gap: 10px; }
.finish-btn {
  flex: 1; padding: 16px; border-radius: 13px; border: none;
  font-size: 15px; font-weight: 800; letter-spacing: 0.06em;
  cursor: pointer; text-transform: uppercase; transition: all 0.2s;
}
.reset-btn {
  padding: 16px 18px; border-radius: 13px;
  border: 1px solid var(--border); background: transparent;
  color: var(--muted); font-size: 13px; cursor: pointer;
}

/* BJJ / REST */
.center-block { text-align: center; padding: 70px 20px; }
.center-icon { font-size: 64px; }
.center-title { font-size: 28px; font-weight: 800; letter-spacing: 0.08em; margin-top: 14px; }
.center-sub { font-size: 14px; color: var(--muted); margin-top: 7px; }
.bjj-item {
  margin-top: 13px; padding: 14px 17px; background: var(--surface);
  border-radius: 11px; border: 1px solid var(--border); text-align: left;
}
.bjj-item-name { font-size: 15px; font-weight: 600; }
.bjj-item-note { font-size: 12px; color: var(--muted); margin-top: 4px; }

/* === WEEK VIEW === */
.week-wrap { padding: 16px; }
.section-title { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }

.vol-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
.vol-pill {
  padding: 9px 15px; border-radius: 9px; border: 1px solid;
}
.vol-pill-label { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
.vol-pill-val { font-size: 16px; font-weight: 800; color: var(--text); margin-top: 3px; }

.week-day-btn {
  width: 100%; text-align: left; padding: 15px 17px; margin-bottom: 7px;
  border-radius: 11px; cursor: pointer; border: 1px solid var(--border);
  border-left: 3px solid var(--day-color, #888); background: var(--surface);
  display: flex; align-items: center; justify-content: space-between;
  transition: all 0.15s;
}
.week-day-btn.today { background: color-mix(in srgb, var(--day-color, #888) 8%, transparent); border-color: color-mix(in srgb, var(--day-color, #888) 40%, transparent); }
.wdb-short-wrap { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.wdb-short { font-size: 12px; font-weight: 700; letter-spacing: 0.1em; }
.today-badge { font-size: 10px; background: var(--day-color, #888); color: #fff; padding: 2px 7px; border-radius: 4px; font-weight: 700; }
.wdb-title { font-size: 15px; font-weight: 600; color: var(--text); }
.wdb-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.wdb-right { font-size: 13px; color: var(--muted); }

.prog-box { margin-top: 20px; padding: 17px; background: #f0f7f2; border: 1px solid #c0dac8; border-radius: 11px; }
.prog-box-title { font-size: 10px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: #1a6a3a; margin-bottom: 14px; }
.prog-rule { margin-bottom: 13px; }
.prog-rule:last-child { margin-bottom: 0; }
.prog-rule-name { font-size: 13px; font-weight: 700; color: var(--text); }
.prog-rule-desc { font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.6; }

/* === LOG VIEW === */
.log-wrap { padding: 16px; }
.log-empty { text-align: center; padding: 60px 20px; color: var(--muted); }
.log-empty-icon { font-size: 40px; }
.log-empty-title { font-size: 15px; margin-top: 14px; }
.log-empty-sub { font-size: 12px; margin-top: 7px; color: #aaa; }

.log-entry {
  margin-bottom: 10px; padding: 15px 17px;
  background: var(--surface); border: 1px solid var(--border);
  border-left: 3px solid var(--day-color, #555); border-radius: 11px;
}
.log-entry-head { display: flex; justify-content: space-between; margin-bottom: 9px; }
.log-entry-title { font-size: 14px; font-weight: 700; }
.log-entry-date { font-size: 11px; color: var(--muted); margin-top: 2px; }
.log-entry-count { font-size: 12px; color: var(--muted); }
.log-ex-row { display: flex; justify-content: space-between; padding: 5px 0; border-top: 1px solid var(--border2); }
.log-ex-name { font-size: 12px; color: #aaa; }
.log-ex-val { font-size: 12px; color: var(--muted); }
.clear-log-btn {
  width: 100%; padding: 14px; margin-top: 10px;
  background: transparent; border: 1px solid #e0c8c8;
  border-radius: 11px; color: #993333; font-size: 12px; cursor: pointer;
}

/* Toast */
#toast {
  position: fixed; bottom: calc(90px + var(--safe-bot)); left: 50%; transform: translateX(-50%) translateY(20px);
  background: #e8f5e8; border: 1px solid #4a9a4a; color: #2a7a2a;
  padding: 11px 22px; border-radius: 100px; font-size: 13px; font-weight: 600;
  opacity: 0; transition: all 0.3s; pointer-events: none; white-space: nowrap; z-index: 200;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="topbar">
  <div id="topbar-inner">
    <div class="topbar-row1">
      <div>
        <div class="day-title-label" id="tb-label">Plan 04</div>
        <div class="day-title-main" id="tb-title">—</div>
      </div>
      <div class="ring-wrap">
        <svg width="48" height="48" viewBox="0 0 48 48">
          <circle cx="24" cy="24" r="20" fill="none" stroke="#1e1e22" stroke-width="4"/>
          <circle id="ring-arc" cx="24" cy="24" r="20" fill="none" stroke="#888" stroke-width="4"
            stroke-linecap="round" stroke-dasharray="125.6" stroke-dashoffset="125.6"
            style="transition:stroke-dashoffset 0.4s ease, stroke 0.3s"/>
        </svg>
        <div class="ring-inner" id="ring-pct">0%</div>
      </div>
    </div>
    <div id="day-strip"></div>
    <div id="nav">
      <div class="nav-bg">
        <button class="nav-tab active" data-view="session" onclick="setView('session')">Session</button>
        <button class="nav-tab" data-view="week" onclick="setView('week')">Overview</button>
        <button class="nav-tab" data-view="log" onclick="setView('log')">History</button>
      </div>
    </div>
  </div>
</div>

<div id="scroll">
  <div id="view-session"></div>
  <div id="view-week" style="display:none"></div>
  <div id="view-log" style="display:none"></div>
</div>

<div id="toast">✓ Session logged!</div>

<script>
const COLORS = { push:"#C8390A", pull:"#1A4FA8", lower:"#1A7A48", bjj:"#B8860B", pump:"#7B2FBE", rest:"#444" };

const PLAN = {
  MON: { label:"Monday", short:"MON", type:"bjj", title:"Jiu-Jitsu", subtitle:"Back on the mats",
    exercises:[
      {id:"bjj-m1", name:"Drilling + Technique", isBJJ:true, note:"Focus on fundamentals"},
      {id:"bjj-m2", name:"Live Rolling", isBJJ:true, note:"Active recovery mindset"},
    ]},
  TUE: { label:"Tuesday", short:"TUE", type:"push", title:"Upper Push", subtitle:"Chest Focus",
    exercises:[
      {id:"flat-db",    name:"Flat DB Press",            sets:4, reps:"6–8",    w:55,   u:"lbs", section:"Primary Compound", prog:"Add 2.5 lbs when top of range hit 2 sessions"},
      {id:"incline-db", name:"Incline DB Press",         sets:3, reps:"8–10",   w:50,   u:"lbs", prog:"Double progression"},
      {id:"fly-low",    name:"Low-to-High Cable Fly",    sets:3, reps:"12–15",  w:20,   u:"lbs", section:"Isolation + Pump"},
      {id:"w-dips",     name:"Weighted Dips",            sets:3, reps:"8–10",   w:0,    u:"lbs", note:"Forward lean = chest bias", prog:"BW → add weight when easy"},
      {id:"ohce-tue",   name:"Overhead Cable Extension", sets:3, reps:"12–15",  w:25,   u:"lbs"},
      {id:"ab-wheel",   name:"Ab Wheel Rollout",         sets:3, reps:"8–12",   w:0,    u:"",    section:"Abs — Anti-Extension", isAbs:true, prog:"Progress to standing when 12 reps easy"},
      {id:"w-plank",    name:"Weighted Plank",           sets:2, reps:"45 sec", w:25,   u:"lbs", isAbs:true},
    ]},
  WED: { label:"Wednesday", short:"WED", type:"pull", title:"Upper Pull", subtitle:"Back + Biceps", hasRun:true,
    exercises:[
      {id:"lat-pd",       name:"Lat Pulldown (neutral)", sets:4, reps:"8–10",   w:135,  u:"lbs", section:"Primary Pull", prog:"Double progression"},
      {id:"cs-row-wed",   name:"Chest-Supported Row",   sets:4, reps:"8–10",   w:100,  u:"lbs", note:"3 sec eccentric"},
      {id:"hammer-wed",   name:"DB Hammer Curl",        sets:4, reps:"10–12",  w:30,   u:"lbs", section:"Arms"},
      {id:"incline-curl", name:"Incline DB Curl",       sets:3, reps:"8–10",   w:25,   u:"lbs", note:"Long head stretch"},
      {id:"face-pulls",   name:"Face Pulls",            sets:3, reps:"15",     w:30,   u:"lbs"},
      {id:"pallof",       name:"Pallof Press",          sets:3, reps:"12/side",w:40,   u:"lbs", section:"Abs — Rotation", isAbs:true, note:"Full pause at extension"},
      {id:"cable-crunch-w",name:"Cable Crunch",         sets:3, reps:"15",     w:40,   u:"lbs", isAbs:true},
    ]},
  THU: { label:"Thursday", short:"THU", type:"rest", title:"Rest Day", subtitle:"Recover & Grow", exercises:[] },
  FRI: { label:"Friday", short:"FRI", type:"bjj", title:"Jiu-Jitsu", subtitle:"Grip carries over from Wed",
    exercises:[
      {id:"bjj-f1", name:"Drilling + Technique", isBJJ:true, note:"Precise movement work"},
      {id:"bjj-f2", name:"Live Rolling", isBJJ:true, note:"Apply the week's drilling"},
    ]},
  SAT: { label:"Saturday", short:"SAT", type:"lower", title:"Lower Body", subtitle:"+ Abs",
    exercises:[
      {id:"tbdl",         name:"Trap Bar Deadlift",     sets:4, reps:"5",       w:140,  u:"lbs", section:"Primary Compound", prog:"Add 5 lbs when all 4 sets clean"},
      {id:"bss",          name:"Bulgarian Split Squat", sets:3, reps:"8/leg",   w:0,    u:"lbs", note:"Add DBs when BW easy"},
      {id:"hip-thrust",   name:"Hip Thrust",            sets:3, reps:"10–12",   w:55,   u:"lbs", section:"Accessory"},
      {id:"ham-curl",     name:"Hamstring Curl",        sets:3, reps:"12–15",   w:0,    u:"lbs", note:"Slow eccentric"},
      {id:"hang-raise",   name:"Hanging Leg Raise",     sets:3, reps:"10–12",   w:0,    u:"",    section:"Abs — Loaded", isAbs:true, prog:"Upgrade from knee raise"},
      {id:"cable-crunch-s",name:"Cable Crunch",         sets:3, reps:"15",      w:40,   u:"lbs", isAbs:true},
      {id:"lsit",         name:"L-Sit Hold (dip bars)", sets:3, reps:"15–20s",  w:0,    u:"",    isAbs:true, prog:"10s → 20s → tucked → full"},
    ]},
  SUN: { label:"Sunday", short:"SUN", type:"pump", title:"Chest Pump", subtitle:"+ Arms", hasRun:true,
    exercises:[
      {id:"mach-press", name:"Machine Chest Press",      sets:3, reps:"12–15",  w:120,  u:"lbs", section:"Chest Volume", note:"Squeeze hard at peak"},
      {id:"fly-mid",    name:"Cable Chest Fly (mid)",    sets:3, reps:"15",     w:20,   u:"lbs", note:"2 sec hold at peak"},
      {id:"decline-pu", name:"Decline Push-Up",          sets:2, reps:"Failure",w:0,    u:"",    note:"BW finisher"},
      {id:"tri-pd",     name:"Triceps Rope Pushdown",    sets:3, reps:"12–15",  w:50,   u:"lbs", section:"Arms"},
      {id:"hammer-sun", name:"DB Hammer Curl",           sets:3, reps:"12",     w:27.5, u:"lbs"},
      {id:"ohce-sun",   name:"Overhead Cable Extension", sets:2, reps:"15",     w:22.5, u:"lbs"},
    ]},
};

const DAYS = ["MON","TUE","WED","THU","FRI","SAT","SUN"];
const TODAY_KEY = ["SUN","MON","TUE","WED","THU","FRI","SAT"][new Date().getDay()];

let activeDay = TODAY_KEY;
let currentView = "session";
let weights = loadLS("w_v1", {});
let doneSets = loadLS("s_v1", {});
let sessionLog = loadLS("l_v1", []);
let editingEx = null;

function loadLS(k, def) { try { const v=localStorage.getItem(k); return v?JSON.parse(v):def; } catch(e){return def;} }
function saveLS(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
function getW(exId, def) { return weights[exId] !== undefined ? weights[exId] : def; }
function dayColor() { return COLORS[PLAN[activeDay].type] || "#888"; }

function dayProgress() {
  const exs = PLAN[activeDay].exercises.filter(e => e.sets);
  if (!exs.length) return 1;
  const total = exs.reduce((a,e) => a+e.sets, 0);
  const done = exs.reduce((a,e) => {
    return a + Array.from({length:e.sets},(_,i)=>!!doneSets[`${activeDay}-${e.id}-${i}`]).filter(Boolean).length;
  },0);
  return total ? done/total : 0;
}

function updateTopbar() {
  const d = PLAN[activeDay];
  const col = dayColor();
  document.getElementById("tb-label").textContent = d.label.toUpperCase();
  document.getElementById("tb-title").textContent = d.title;
  document.documentElement.style.setProperty("--day-color", col);
  const prog = dayProgress();
  const arc = document.getElementById("ring-arc");
  const circumference = 2 * Math.PI * 20;
  arc.setAttribute("stroke-dashoffset", circumference * (1 - prog));
  arc.setAttribute("stroke", col);
  document.getElementById("ring-pct").textContent = Math.round(prog*100) + "%";
  document.getElementById("ring-pct").style.color = prog > 0.9 ? col : "#888";
}

function buildDayStrip() {
  const strip = document.getElementById("day-strip");
  strip.innerHTML = "";
  DAYS.forEach(dk => {
    const d = PLAN[dk];
    const col = COLORS[d.type] || "#888";
    const btn = document.createElement("button");
    btn.className = "day-btn" + (dk === activeDay ? " active" : "");
    btn.style.setProperty("--day-color", col);
    btn.textContent = d.short;
    if (dk === TODAY_KEY) {
      const dot = document.createElement("span");
      dot.className = "today-dot";
      btn.appendChild(dot);
    }
    btn.onclick = () => { activeDay = dk; editingEx = null; buildDayStrip(); updateTopbar(); renderSession(); };
    strip.appendChild(btn);
  });
}

function updateTopbarHeight() {
  const h = document.getElementById("topbar").offsetHeight;
  document.getElementById("scroll").style.paddingTop = (h + 4) + "px";
}

function setView(v) {
  currentView = v;
  ["session","week","log"].forEach(n => {
    document.getElementById("view-"+n).style.display = n===v ? "block" : "none";
    document.querySelector(`[data-view="${n}"]`).classList.toggle("active", n===v);
  });
  if (v === "session") renderSession();
  if (v === "week") renderWeek();
  if (v === "log") renderLog();
}

function renderSession() {
  const wrap = document.getElementById("view-session");
  const d = PLAN[activeDay];
  const col = dayColor();

  if (d.type === "rest") {
    wrap.innerHTML = `<div class="center-block">
      <div class="center-icon">🛌</div>
      <div class="center-title" style="color:#555">REST DAY</div>
      <div class="center-sub">Sleep. Eat. Grow.</div>
    </div>`; return;
  }

  if (d.type === "bjj") {
    wrap.innerHTML = `<div class="center-block">
      <div class="center-icon">🥋</div>
      <div class="center-title" style="color:${col}">JIU-JITSU</div>
      <div class="center-sub">${d.subtitle}</div>
      ${d.exercises.map(e=>`<div class="bjj-item">
        <div class="bjj-item-name">${e.name}</div>
        ${e.note?`<div class="bjj-item-note">${e.note}</div>`:""}
      </div>`).join("")}
    </div>`; return;
  }

  let html = `<div class="session-wrap">`;
  if (d.hasRun) html += `<div class="run-banner">🏃 Optional easy run — 30–40 min at ~6:50/km</div>`;

  let lastSection = null;
  d.exercises.forEach(ex => {
    if (ex.section && ex.section !== lastSection) {
      lastSection = ex.section;
      html += `<div class="section-head ${ex.isAbs?'abs-head':'norm-head'}">${ex.section}</div>`;
    }
    const w = getW(ex.id, ex.w ?? 0);
    const isAbs = ex.isAbs;
    const progColor = isAbs ? "var(--abs)" : col;

    let weightHTML = "";
    if (ex.u) {
      if (editingEx === ex.id) {
        weightHTML = `<div class="weight-input-wrap">
          <input class="weight-input" id="wi-${ex.id}" type="number" inputmode="decimal" value="${w}"
            onkeydown="if(event.key==='Enter')commitWeight('${ex.id}')"
            onblur="commitWeight('${ex.id}')" style="border-color:${progColor}">
          <span style="font-size:11px;color:var(--muted)">${ex.u}</span>
        </div>`;
      } else {
        weightHTML = `<button class="weight-btn" onclick="startEdit('${ex.id}',${w})">
          ${w}<span class="weight-unit">${ex.u}</span>
        </button>`;
      }
    }

    let setsHTML = "";
    if (ex.sets) {
      setsHTML = `<div class="sets-row">`;
      for (let i = 0; i < ex.sets; i++) {
        const done = !!doneSets[`${activeDay}-${ex.id}-${i}`];
        const absClass = isAbs && done ? " abs-set" : "";
        setsHTML += `<button class="set-btn${done?" done":""}${absClass}"
          onclick="toggleSet('${ex.id}',${i})"
          style="${done?`--day-color:${progColor}`:""}">
          <span class="set-num">${done?"✓":i+1}</span>
          <span class="set-lbl">set</span>
        </button>`;
      }
      setsHTML += `</div>`;
    }

    html += `<div class="ex-row">
      <div class="ex-top">
        <div class="ex-info">
          <div class="ex-name">${ex.name}</div>
          <div class="ex-sets-label">${ex.sets?`${ex.sets} × ${ex.reps}`:ex.reps||""}</div>
          ${ex.note?`<div class="ex-note">${ex.note}</div>`:""}
          ${ex.prog?`<div class="ex-prog" style="color:${progColor}">↑ ${ex.prog}</div>`:""}
        </div>
        ${weightHTML}
      </div>
      ${setsHTML}
    </div>`;
  });

  const prog = dayProgress();
  const finBg = prog >= 0.5 ? col : "#e8e5e0";
  const finColor = prog >= 0.5 ? "#fff" : "#aaa";

  html += `<div class="finish-row">
    <button class="finish-btn" onclick="finishSession()" style="background:${finBg};color:${finColor}">
      Finish Session
    </button>
    <button class="reset-btn" onclick="clearDay()">Reset</button>
  </div></div>`;

  wrap.innerHTML = html;
  if (editingEx) {
    const inp = document.getElementById("wi-" + editingEx);
    if (inp) { inp.focus(); inp.select(); }
  }
}

function startEdit(exId, val) { editingEx = exId; renderSession(); }

function commitWeight(exId) {
  const inp = document.getElementById("wi-" + exId);
  if (inp) { const v = parseFloat(inp.value); if (!isNaN(v)) { weights[exId] = v; saveLS("w_v1", weights); } }
  editingEx = null; renderSession(); updateTopbar();
}

function toggleSet(exId, idx) {
  const key = `${activeDay}-${exId}-${idx}`;
  doneSets[key] = !doneSets[key];
  saveLS("s_v1", doneSets);
  updateTopbar(); renderSession();
}

function finishSession() {
  const d = PLAN[activeDay];
  sessionLog = [{
    date: new Date().toLocaleDateString("en-CA"),
    day: activeDay, title: d.title, color: dayColor(),
    exercises: d.exercises.filter(e=>e.sets).map(e => ({
      name:e.name, sets:e.sets, w:getW(e.id, e.w??0), u:e.u
    }))
  }, ...sessionLog.slice(0,29)];
  saveLS("l_v1", sessionLog);
  showToast();
}

function clearDay() {
  const prefix = activeDay + "-";
  Object.keys(doneSets).forEach(k => { if (k.startsWith(prefix)) delete doneSets[k]; });
  saveLS("s_v1", doneSets); updateTopbar(); renderSession();
}

function showToast() {
  const t = document.getElementById("toast");
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2500);
}

function renderWeek() {
  const wrap = document.getElementById("view-week");
  const vols = [
    {label:"Chest", val:"16 sets/wk", color:"#C8390A"},
    {label:"Abs",   val:"3× sessions",color:"#b03060"},
    {label:"Back",  val:"14 sets/wk", color:"#1A4FA8"},
    {label:"Legs",  val:"13 sets/wk", color:"#1A7A48"},
  ];
  let html = `<div class="week-wrap">
    <div class="section-title">Weekly Volume</div>
    <div class="vol-row">
      ${vols.map(v=>`<div class="vol-pill" style="background:color-mix(in srgb,${v.color} 10%,transparent);border-color:color-mix(in srgb,${v.color} 35%,transparent)">
        <div class="vol-pill-label" style="color:${v.color}">${v.label}</div>
        <div class="vol-pill-val">${v.val}</div>
      </div>`).join("")}
    </div>
    <div class="section-title">Schedule</div>`;

  DAYS.forEach(dk => {
    const d = PLAN[dk];
    const col = COLORS[d.type] || "#888";
    const isToday = dk === TODAY_KEY;
    const exCount = d.exercises.filter(e=>e.sets).length;
    const right = d.type==="bjj"?"🥋":d.type==="rest"?"🛌":exCount?`${exCount} ex`:"";
    html += `<button class="week-day-btn${isToday?" today":""}" style="--day-color:${col}"
      onclick="activeDay='${dk}';buildDayStrip();updateTopbar();setView('session')">
      <div>
        <div class="wdb-short-wrap">
          <span class="wdb-short" style="color:${col}">${d.short}</span>
          ${isToday?`<span class="today-badge" style="background:${col}">TODAY</span>`:""}
        </div>
        <div class="wdb-title">${d.title}</div>
        <div class="wdb-sub">${d.subtitle}</div>
      </div>
      <div class="wdb-right">${right}</div>
    </button>`;
  });

  html += `<div class="prog-box">
    <div class="prog-box-title">Progression Rules</div>
    ${[
      ["Double Progression","Hit top of rep range 2 sessions in a row → add smallest increment"],
      ["Chest Priority","Flat DB + Incline DB are the engine. Never sacrifice form for weight."],
      ["Abs Levels","Ab wheel: knees→standing. Leg raise: bent→straight. L-sit: 10s→20s→full."],
      ["BJJ Days","Mon & Fri — no gym. Upper back and grip taxed from rolling."],
    ].map(([n,d])=>`<div class="prog-rule">
      <div class="prog-rule-name">${n}</div>
      <div class="prog-rule-desc">${d}</div>
    </div>`).join("")}
  </div></div>`;

  wrap.innerHTML = html;
}

function renderLog() {
  const wrap = document.getElementById("view-log");
  if (!sessionLog.length) {
    wrap.innerHTML = `<div class="log-wrap">
      <div class="section-title">Session History</div>
      <div class="log-empty">
        <div class="log-empty-icon">📋</div>
        <div class="log-empty-title">No sessions logged yet</div>
        <div class="log-empty-sub">Complete a session and tap Finish to log it</div>
      </div>
    </div>`; return;
  }
  let html = `<div class="log-wrap"><div class="section-title">Session History</div>`;
  sessionLog.forEach(entry => {
    html += `<div class="log-entry" style="--day-color:${entry.color||"#555"}">
      <div class="log-entry-head">
        <div>
          <div class="log-entry-title">${entry.title}</div>
          <div class="log-entry-date">${entry.date} · ${entry.day}</div>
        </div>
        <div class="log-entry-count">${entry.exercises.length} ex</div>
      </div>
      ${entry.exercises.map(e=>`<div class="log-ex-row">
        <span class="log-ex-name">${e.name}</span>
        <span class="log-ex-val">${e.sets}× ${e.w>0?e.w+" "+e.u:"BW"}</span>
      </div>`).join("")}
    </div>`;
  });
  html += `<button class="clear-log-btn" onclick="if(confirm('Clear all history?')){sessionLog=[];saveLS('l_v1',sessionLog);renderLog()}">
    Clear History
  </button></div>`;
  wrap.innerHTML = html;
}

// INIT
buildDayStrip();
updateTopbar();
renderSession();
updateTopbarHeight();
window.addEventListener("resize", updateTopbarHeight);
</script>
</body>
</html>
